<script>
document.getElementById("scheduleForm").addEventListener("submit", function(e) {
    e.preventDefault(); // stop page reload

    // Get form values
    const deliveryId = document.getElementById("deliveryId").value.trim();
    const orderId = document.getElementById("orderId").value.trim();
    const driverId = document.getElementById("driverId").value.trim();
    const deliveryDate = document.getElementById("deliveryDate").value;
    const deliveryStatus = document.getElementById("deliveryStatus").value;
    const routeDetails = document.getElementById("routeDetails").value.trim();

    // Validation
    if (!deliveryId || !orderId || !driverId || !deliveryDate || !routeDetails) {
        alert("Please fill all delivery details");
        return;
    }

    // Success message (localhost alert)
    alert("Delivery assigned successfully!");

    // Reset form
    document.getElementById("scheduleForm").reset();
});
</script>
